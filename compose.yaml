
services:
  db:
    image: postgres:18-alpine
    container_name: clinic-postgres
    environment:
      POSTGRES_DB: clinic_booking
      POSTGRES_USER: clinic_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  postgres_data:
