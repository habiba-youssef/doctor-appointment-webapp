
services:

  # PostgreSQL database
  db:
    image: postgres:18-alpine
    container_name: clinic-postgres
    environment:
      POSTGRES_DB: clinic_booking
      POSTGRES_USER: clinic_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic_user -d clinic_booking"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ASP.NET Core backend
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5126:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080

      ConnectionStrings__ClinicDb: "Host=db;Port=5432;Database=clinic_booking;Username=clinic_user;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"

      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      SeedUsers__ReceptionistPassword: ${RECEPTIONIST_PASSWORD:?Set RECEPTIONIST_PASSWORD in .env}
      SeedUsers__DoctorPassword: ${DOCTOR_PASSWORD:?Set DOCTOR_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Angular frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
